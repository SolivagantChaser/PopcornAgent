syntax = "proto3";
package com.agent.adapter.python; // 这个是Protobuf自身的包名，可不变
option java_multiple_files = true;
option java_package = "com.popcorn.agent.core.adapter.python.grpc"; // 修正为带popcorn的包名
option java_outer_classname = "PythonAgentProto"; // Java外部类名
option objc_class_prefix = "PAP";

// 核心服务名：PythonAgentService（生成存根的关键）
service PythonAgentService {
  // 核心方法名1：LlmInfer → 生成Java方法：llmInfer
  rpc LlmInfer (LlmInferRequest) returns (LlmInferResponse) {}
  // 核心方法名2：DataProcess → 生成Java方法：dataProcess
  rpc DataProcess (DataProcessRequest) returns (DataProcessResponse) {}
}

// 以下消息类生成同名Java类，直接导入使用
message LlmInferRequest {
  string prompt = 1;
  string model = 2;
  map<string, string> parameters = 3;
}
message LlmInferResponse {
  bool success = 1;
  string result = 2;
  string error_msg = 3;
}
message DataProcessRequest {
  string data = 1;
  string process_type = 2;
}
message DataProcessResponse {
  bool success = 1;
  string result = 2;
  string error_msg = 3;
}